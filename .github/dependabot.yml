version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
    labels: [dependencies]
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
